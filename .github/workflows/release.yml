name: Release WinOpti

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($version -cnotmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$' -or $env:GITHUB_REF_NAME -cne "v$version") {
            throw "The tag must match the stable version in package.json."
          }
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run package:win
      - name: Publish Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $installer = "release/WinOpti-Setup-$version-x64.exe"
          if (!(Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Installer missing." }
          gh release create $env:GITHUB_REF_NAME $installer --verify-tag --generate-notes --title "WinOpti $version"
